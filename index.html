<style>

und:var(--orange);border-radius:7px}.intro{font-size:18px;line-height:1.45;font-weight:780;margin:0}.guides{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.guide{background:#f1f4ed;border:1px dashed #c9d4cb;border-radius:14px;text-align:center;padding:11px 4px}.guide b{display:block;font-size:24px;margin-bottom:6px}.guide span{display:block;font-size:11px;color:#62757a;font-weight:850;line-height:1.35}.btn{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;border:0;background:var(--orange);color:var(--ink);border-radius:13px;padding:16px;font-weight:1000;font-size:14px;box-shadow:0 4px 0 #d76b49}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d76b49}.btn.secondary{background:var(--dark);color:white;box-shadow:0 4px 0 #07121a}.btn.outline{background:transparent;border:1.5px solid #cbd4d1;box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}.stack{display:grid;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{padding:12px 6px;text-align:center;background:#e8eee8;border-radius:13px}.stat b{font-size:22px;letter-spacing:-.03em;display:block}.stat span{font-weight:800;letter-spacing:.05em;color:#647980;text-transform:uppercase;font-size:9px}.fine{text-align:center;color:#76858b;font-size:12px;line-height:1.6}.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 20px;gap:10px}.pill{border:1px solid #cdd6d2;border-radius:100px;background:#fff;padding:9px 12px;font-size:12px;font-weight:900;color:var(--ink)}.mode{color:#63757b;letter-spacing:.12em;font-size:11px;font-weight:950}.case-label{display:inline-block;background:#e6efdd;padding:9px 11px;border-radius:8px;font-size:10px;font-weight:1000;letter-spacing:.12em}.case-title{font-size:33px;font-weight:1000;letter-spacing:-.045em;line-height:1.09;margin:12px 0 7px}.case-desc{margin:0;color:#61757d;line-height:1.5;font-size:13px}.case-meta{display:flex;justify-content:space-between;align-items:center;margin:21px 0 10px;font-weight:950;font-size:11px;letter-spacing:.08em}.hearts{display:flex;gap:4px}.heart{width:19px;height:9px;border-radius:20px;background:#d5ddd8}.heart.on{background:var(--orange)}.witnesses{display:grid;gap:10px}.witness{width:100%;display:grid;grid-template-columns:42px 1fr 21px;text-align:left;align-items:start;gap:11px;border:2px solid #dbe1dd;background:#fff;border-radius:15px;padding:13px 11px;min-height:94px;color:var(--ink)}.witness.selected{border-color:#f89068;background:#fff1e9}.face{display:grid;place-items:center;background:#eff4e8;border-radius:12px;width:42px;height:42px;font-size:23px}.witness:nth-child(2) .face{background:#f0ebfd}.witness:nth-child(3) .face{background:#fff0d7}.who{display:block;color:#78878e;font-weight:950;letter-spacing:.12em;font-size:10px;margin-bottom:5px}.said{display:block;font-size:14px;line-height:1.42;font-weight:790}.circle{border:2px solid #b8c5c0;width:20px;height:20px;border-radius:50%;margin-top:4px}.selected .circle{background:var(--orange);border-color:var(--orange)}.selected .circle:after{content:'✓';font-size:13px;font-weight:1000;display:block;text-align:center;line-height:16px}.entry{margin-top:17px}.entry label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:950;margin-bottom:10px}.entry input{display:block;width:100%;background:white;border:2px solid #cad5cf;border-radius:12px;color:var(--ink);padding:14px 15px;font-size:20px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;outline:none}.entry input:focus{border-color:var(--ink)}.entry input::placeholder{letter-spacing:0;font-size:14px;font-weight:550;text-transform:none;color:#97a3a7}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:13px}.actions .btn{padding:14px 7px;font-size:12px}.hint{border-left:4px solid #99ba70;background:#eef3df;border-radius:0 10px 10px 0;padding:11px;margin-top:10px;font-size:12px;font-weight:800;line-height:1.5}.notice{background:#fff0e7;color:#853e2d;border-radius:11px;margin-top:12px;padding:12px;font-size:12px;font-weight:850;line-height:1.4}.small{color:#6b7c82;font-size:12px;line-height:1.55;margin:12px 0 0}.result{text-align:center;padding:15px 5px}.emoji{display:block;font-size:58px}.result h2{font-size:34px;letter-spacing:-.06em;line-height:1;margin:8px 0}.answer{font-size:36px;letter-spacing:.1em;font-weight:1000;color:#ee7556;margin:15px 0;overflow-wrap:anywhere}.points{font-size:42px;font-weight:1000;line-height:1;margin-top:20px}.points-label{letter-spacing:.12em;font-weight:900;font-size:10px;color:#61757b}.explain{background:#ebf1e9;text-align:left;padding:15px;border-radius:14px;line-height:1.5;font-size:13px;margin:16px 0}.explain strong{display:block;margin-bottom:7px}.details{display:grid;gap:0;margin-bottom:16px}.detail{display:flex;justify-content:space-between;gap:14px;padding:12px 4px;border-bottom:1px solid #dfe6df;font-size:13px}.detail b{white-space:nowrap}.footer{text-align:center;color:#778b91;padding:3px 20px 25px;font-size:10px;line-height:1.7}@media(prefers-reduced-motion:no-preference){.card{animation:pop .18s ease-out}@keyframes pop{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}

<body><div class="wrap"><header class="header"><div class="mast"><div class="logo">WORD<span>●</span>CRIME</div><div class="stamp">POCKET DETECTIVE DIVISION</div></div><p class="kicker" id="kicker">CLASSIFIED CASE FILES</p><h1>ONE WORD.<br><em>ONE LIAR.</em></h1><p class="tagline" id="tagline">Three witnesses. Two truths. One very suspicious story. Can you crack the secret word?</p></header><main class="main" id="app"></main><footer class="footer">A tiny original detective game • No account or ads<br>Progress stays in this browser.</footer></div>
<script>
'use strict';
(()=>{
const CASES=[
 ['KAYA','The Breakfast Conspiracy','SINGAPORE','EASY',['I often appear between two slices of toast.','Coconut milk, eggs and sugar help make me.','I am a savoury paste made from fermented soybeans.'],2,['I often appear alongside soft-boiled eggs.','The first letter is K.'],'Kaya is a sweet coconut-and-egg jam. It is not fermented soybean paste.'],
 ['DURIAN','The Forbidden Passenger','SINGAPORE','EASY',['My distinctive smell can fill a room.','I wear a thorn-covered shell.','My skin is smooth and I smell like mint.'],2,['I am a fruit with famously devoted fans.','The first letter is D.'],'Durian has a spiky husk and a strong aroma—not smooth skin and a mint scent.'],
 ['SATAY','The Midnight Skewer','SINGAPORE','EASY',['I am usually grilled on sticks.','Peanut sauce is often served with me.','I am a chilled dessert made from shaved ice.'],2,['You can find me at hawker centres.','The first letter is S.'],'Satay is grilled skewered food, not a shaved-ice dessert.'],
 ['MERLION','The Waterfront Impostor','SINGAPORE','MEDIUM',['My upper half resembles a lion.','My lower half resembles a fish.','I am a dragon with the body of a horse.'],2,['A famous Singapore landmark shares my name.','The first letter is M.'],'The Merlion is half lion and half fish—not dragon and horse.'],
 ['KOPI','The Hawker House Mystery','SINGAPORE','EASY',['You might order me with condensed milk.','My beans are roasted before brewing.','I am brewed from tea leaves, never coffee beans.'],2,['I am the local word for coffee.','The first letter is K.'],'Kopi is coffee. Tea leaves make teh.'],
 ['CHENDOL','The Green Jelly Affair','SINGAPORE','MEDIUM',['I can contain green jelly strands.','Coconut milk and palm sugar often join me.','I am a savoury dish served in chicken broth.'],2,['I am a Southeast Asian iced dessert.','The first letter is C.'],'Chendol is a sweet dessert rather than chicken soup.'],
 ['OTTER','The Riverbank Escape','ANIMALS','EASY',['I am a playful mammal often seen near water.','My family sometimes lives near Singapore waterways.','I breathe underwater through gills.'],2,['I have whiskers and swim well.','The first letter is O.'],'Otters are mammals that breathe air with lungs, not gills.'],
 ['JEWEL','The Airport Enigma','SINGAPORE','MEDIUM',['I am connected to Changi Airport.','An enormous indoor waterfall is one of my attractions.','I am a submarine station beneath Marina Bay.'],2,['My name also means a precious gem.','The first letter is J.'],'Jewel Changi Airport is a shopping and leisure complex, not a submarine station.'],
 ['SAMBAL','The Red Sauce Riddle','SINGAPORE','MEDIUM',['Chillies are important in many versions of me.','You might find me alongside nasi lemak.','I am always a sweet dairy custard.'],2,['I am often a spicy condiment.','The first letter is S.'],'Sambal is typically chilli-based rather than a dairy custard.'],
 ['PIXEL','The Digital Fingerprint','TECH','EASY',['Millions of me can make a screen image.','I can carry a colour value in a digital picture.','I am a rechargeable AA battery.'],2,['I am a tiny element of a digital image.','The first letter is P.'],'A pixel is a picture element—not a battery.'],
 ['CIPHER','The Secret Message','TECH','HARD',['I can transform readable words into coded text.','Cryptographers study systems like me.','I am a string instrument played with a bow.'],2,['My secrets can depend on a key.','The first letter is C.'],'A cipher is an encryption method, not a musical instrument.'],
 ['ORBIT','The Missing Satellite','SPACE','MEDIUM',['Gravity can keep an object travelling along me.','Planets follow paths like me around stars.','I mean a spacecraft staying perfectly still.'],2,['I describe a path around another body.','The first letter is O.'],'An orbit describes motion around a body, not stillness.'],
 ['ECLIPSE','The Stolen Sunlight','SPACE','MEDIUM',['I happen when light gets blocked by a celestial body.','I can make daylight unexpectedly dark.','Everyone on Earth sees me every single day.'],2,['The Sun or Moon may be involved.','The first letter is E.'],'An eclipse is not visible from every location every day.'],
 ['VOLCANO','The Sleeping Mountain','NATURE','EASY',['I can release ash and molten rock.','Magma may reach the surface through me.','I can exist only below the ocean.'],2,['My eruptions can reshape landscapes.','The first letter is V.'],'Volcanoes can exist on land as well as underwater.'],
 ['ECHO','The Second Voice','SOUND','EASY',['You may hear me after shouting into a canyon.','I happen when sound reflects back.','I am made only when light passes through a prism.'],2,['I am the return of a sound.','The first letter is E.'],'An echo is reflected sound, not refracted light.'],
 ['PENGUIN','The Tuxedo Suspect','ANIMALS','EASY',['I am a flightless bird.','I use flipper-like wings to swim.','I have crocodile-like teeth.'],2,['I am often associated with Antarctica.','The first letter is P.'],'Penguins have beaks rather than crocodile teeth.'],
 ['BUBBLE','The Vanishing Sphere','SCIENCE','EASY',['Soap can help make me.','Surface tension helps shape me.','I am always made of solid rock.'],2,['Children love blowing me.','The first letter is B.'],'A soap bubble has a thin liquid film around gas, not solid rock.'],
 ['RIDDLE','The Question With Teeth','LANGUAGE','MEDIUM',['I hide an answer behind clever wording.','People solve me by studying clues.','A calculator is always required to solve me.'],2,['I am a puzzling question.','The first letter is R.'],'Riddles often depend on language and lateral thinking, not arithmetic.'],
 ['ANCHOR','The Missing Ship','OCEAN','MEDIUM',['Ships may lower me to reduce drifting.','I may grip the seabed.','I make a parked ship accelerate.'],2,['Sailors may tell someone to drop me.','The first letter is A.'],'Anchors help hold a vessel in place rather than speed it up.'],
 ['COMPASS','The Northbound Lie','EXPLORATION','MEDIUM',['I can help travellers find direction.','A magnetic version points toward magnetic north.','I measure a person\'s body temperature.'],2,['I often display cardinal directions.','The first letter is C.'],'A compass shows direction. A thermometer shows temperature.'],
 ['CROISSANT','The Buttery Disguise','FOOD','MEDIUM',['My layers come from folded dough and butter.','I am often shaped like a crescent.','I am traditionally made from boiled rice noodles.'],2,['I am a flaky pastry.','The first letter is C.'],'A croissant is a laminated pastry rather than rice noodles.'],
 ['MIRROR','The Other Face','OBJECTS','EASY',['I can show your reflection.','Many of me use coated glass.','I create sunlight out of nothing.'],2,['You might find me in a bathroom.','The first letter is M.'],'Mirrors reflect incoming light; they do not generate sunlight.'],
 ['THUNDER','The Sound of the Storm','NATURE','MEDIUM',['I often follow lightning.','Rapidly expanding hot air makes me.','I am the bright electrical discharge in the sky.'],2,['You hear me in storms.','The first letter is T.'],'Thunder is the sound; lightning is the electrical discharge.'],
 ['LANTERN','The Light in the Alley','OBJECTS','MEDIUM',['I can illuminate a dark path.','Some versions use candles; others use batteries.','I measure the speed of a car.'],2,['I am a portable light source.','The first letter is L.'],'Lanterns provide light, not speed measurements.'],
 ['JASMINE','The Perfumed Letter','NATURE','MEDIUM',['My flowers are often fragrant.','I may be used to scent tea.','I am a mineral mined from volcanoes.'],2,['I am a flowering plant.','The first letter is J.'],'Jasmine is a plant, not a mineral.'],
 ['GLITCH','The Screen That Blinked','TECH','MEDIUM',['I am an unexpected malfunction.','I may cause a video game to act strangely.','I always mean a feature working perfectly as designed.'],2,['I am a tiny digital hiccup.','The first letter is G.'],'A glitch is an anomaly, not a perfectly functioning feature.'],
 ['UMBRELLA','The Rainy Alibi','OBJECTS','EASY',['I open into a canopy.','People carry me to stay dry in rain.','I can guarantee safety from lightning strikes.'],2,['I have folding ribs and a handle.','The first letter is U.'],'Umbrellas do not protect people from lightning.'],
 ['RAMEN','The Midnight Bowl','FOOD','EASY',['I usually contain wheat noodles.','Broth is common in many versions.','I am always a frozen ice-cream dessert.'],2,['I am associated with Japanese noodle dishes.','The first letter is R.'],'Ramen is a noodle dish, not an ice-cream dessert.'],
 ['SCARECROW','The Empty Field','OBJECTS','HARD',['Farmers may place me in fields.','My shape can resemble a person.','I am a living worker hired to plant seeds.'],2,['My name hints at which birds I deter.','The first letter is S.'],'A scarecrow is a deterrent object, not a hired person.'],
 ['KETUPAT','The Woven Parcel','SINGAPORE','MEDIUM',['I can be wrapped in woven palm leaves.','I am made by cooking rice inside a casing.','I am a type of French cheese aged in caves.'],2,['I am often served during Hari Raya.','The first letter is K.'],'Ketupat is compressed rice cooked in a woven casing, not cheese.']
];
const $=s=>document.querySelector(s);const app=$('#app');
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let stats=store.get('wordcrime-stats',{played:0,won:0,streak:0,best:0,points:0,daily:{}}),seen=store.get('wordcrime-seen',[]),view='home',mode='endless',game=null,selected=-1,hints=0,tries=[],error='';
function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function hash(s){let n=7;for(const ch of s)n=(Math.imul(n,31)+ch.charCodeAt(0))|0;return Math.abs(n)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chooseCase(m){if(m==='daily')return hash(day())%CASES.length;let pool=CASES.map((_,i)=>i).filter(i=>!seen.includes(i));if(!pool.length){seen=[];pool=CASES.map((_,i)=>i)}const x=pool[Math.floor(Math.random()*pool.length)];seen.push(x);store.set('wordcrime-seen',seen);return x}
function begin(m){mode=m;const id=chooseCase(m),c=CASES[id],shift=hash(c[0]+id)%3;const witness=c[4].map((text,i)=>({text,i})).map((_,i,a)=>a[(i+shift)%3]);game={id,c,witness};selected=-1;hints=0;tries=[];error='';view='game';render();window.scrollTo(0,0)}
function render(){
 $('#kicker').textContent=view==='home'?'CLASSIFIED CASE FILES':view==='game'?'INVESTIGATION IN PROGRESS':'CASE CLOSED';
 $('#tagline').textContent=view==='home'?'Three witnesses. Two truths. One very suspicious story. Can you crack the secret word?':view==='game'?'Pick the liar. Guess the word. Crack the case.':'The truth always leaves clues.';
 if(view==='home')home();if(view==='game')round();if(view==='result')result();
}
function home(){const already=Object.prototype.hasOwnProperty.call(stats.daily,day());app.innerHTML=`<section class="card"><div class="label">How to play</div><p class="intro">Three people describe a hidden word. Two are telling the truth. One is lying. Can you expose the liar and solve the word?</p><div class="guides"><div class="guide"><b>👀</b><span>Read the clues</span></div><div class="guide"><b>👉</b><span>Accuse the liar</span></div><div class="guide"><b>🔎</b><span>Guess the word</span></div></div><div class="stack"><button class="btn" id="play">OPEN A RANDOM CASE →</button><button class="btn secondary" id="daily">${already?'REPLAY TODAY’S CASE':'TODAY’S SECRET CASE'} ✦</button></div></section><div class="stats"><div class="stat"><b>${stats.played}</b><span>Cases played</span></div><div class="stat"><b>${stats.won}</b><span>Solved</span></div><div class="stat"><b>${stats.streak}</b><span>Streak</span></div></div><p class="fine">${CASES.length} original case files • Singapore + world edition<br>Daily challenge changes at midnight Singapore time.</p>`;$('#play').onclick=()=>begin('endless');$('#daily').onclick=()=>begin('daily')}
function round(){const c=game.c,left=3-tries.length;app.innerHTML=`<div class="bar"><button class="pill" id="back">← CASE DESK</button><span class="mode">${mode==='daily'?'DAILY FILE':'UNLIMITED FILES'}</span></div><span class="case-label">🗃️ CASE #${String(game.id+1).padStart(3,'0')} · ${c[3]}</span><h2 class="case-title">${esc(c[1])}</h2><p class="case-desc">${c[2]} · Answer length: ${c[0].length} letters</p><div class="case-meta"><span>IDENTIFY THE LYING WITNESS</span><span class="hearts">${[0,1,2].map(i=>`<i class="heart ${i<left?'on':''}"></i>`).join('')}</span></div><div class="witnesses">${game.witness.map((w,i)=>`<button class="witness ${selected===i?'selected':''}" data-person="${i}" aria-pressed="${selected===i}"><span class="face">${['🧢','🕶️','🎭'][i]}</span><span><span class="who">WITNESS 0${i+1}</span><span class="said">“${esc(w.text)}”</span></span><span class="circle"></span></button>`).join('')}</div><section class="card entry"><label for="guess">🔐 What is the secret word?</label><input id="guess" placeholder="Type your answer…" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" />${c[6].slice(0,hints).map((h,i)=>`<div class="hint">📎 EVIDENCE 0${i+1} — ${esc(h)}</div>`).join('')}<div class="actions"><button class="btn outline" id="hint" ${hints===2?'disabled':''}>💡 ${hints===2?'NO HINTS LEFT':'HINT −120'}</button><button class="btn" id="check">CHECK EVIDENCE →</button></div>${error?`<div class="notice" role="status">${esc(error)}</div>`:''}<p class="small">${left} guess${left===1?'':'es'} remaining. Pick a liar AND enter the word to submit.</p></section>`;
 $('#back').onclick=()=>{view='home';render()};document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const word=$('#guess').value;selected=Number(b.dataset.person);round();$('#guess').value=word;$('#guess').focus()});$('#hint').onclick=()=>{const word=$('#guess').value;if(hints<2)hints++;error='New evidence unlocked.';round();$('#guess').value=word};$('#check').onclick=submit;$('#guess').onkeydown=e=>{if(e.key==='Enter')submit()};
}
function submit(){const word=$('#guess').value.trim().toUpperCase().replace(/[^A-Z]/g,'');if(selected<0){error='Tap the witness you think is lying first.';round();$('#guess').value=word;return}if(!word){error='Type your secret word first.';round();return}if(tries.includes(word)){error='You already tried that word. Make a new guess.';round();$('#guess').value=word;return}tries.push(word);if(word===game.c[0]){finish(true);return}if(tries.length===3){finish(false);return}error='Not quite! Review the clues and try again.';round()}
function finish(won){const liarCaught=game.witness[selected].i===game.c[5],points=won?Math.max(100,1100-(tries.length-1)*250-hints*120+(liarCaught?200:0)):0;const recorded=mode!=='daily'||!Object.prototype.hasOwnProperty.call(stats.daily,day());if(recorded){stats.played++;if(won){stats.won++;stats.streak++;stats.best=Math.max(stats.best,points);stats.points+=points}else stats.streak=0;if(mode==='daily')stats.daily[day()]=points;store.set('wordcrime-stats',stats)}game.outcome={won,liarCaught,points,recorded};view='result';render();window.scrollTo(0,0)}
function result(){const c=game.c,r=game.outcome,liarIndex=game.witness.findIndex(w=>w.i===c[5]);app.innerHTML=`<section class="card"><div class="result"><span class="emoji">${r.won?'🏆':'🗂️'}</span><h2>${r.won?'CASE CRACKED!':'CASE GONE COLD'}</h2><p class="fine">${r.won?'You solved the word mystery.':'The suspect escaped, but the truth is out.'}</p><div class="answer">${esc(c[0])}</div><div class="points">${r.points.toLocaleString()}</div><span class="points-label">CASE POINTS${r.recorded?'':' • PRACTICE REPLAY'}</span></div><div class="explain"><strong>🎭 LIAR: WITNESS 0${liarIndex+1}</strong>“${esc(game.witness[liarIndex].text)}”<p>${esc(c[7])}</p></div><div class="details"><div class="detail"><span>Word attempts</span><b>${tries.length} / 3</b></div><div class="detail"><span>Liar identified</span><b>${r.liarCaught?'YES • +200':'NO'}</b></div><div class="detail"><span>Evidence hints used</span><b>${hints} / 2</b></div><div class="detail"><span>Current streak</span><b>${stats.streak} case${stats.streak===1?'':'s'}</b></div></div><div class="stack"><button class="btn" id="next">INVESTIGATE NEXT CASE →</button><button class="btn outline" id="share">SHARE YOUR RESULT ↗</button><button class="btn outline" id="back">BACK TO CASE DESK</button></div></section>`;
 $('#next').onclick=()=>begin('endless');$('#back').onclick=()=>{view='home';render()};$('#share').onclick=async()=>{const msg=`WORD CRIME 🕵️\nCase #${String(game.id+1).padStart(3,'0')} ${r.won?'SOLVED':'UNSOLVED'}\n${r.points} points · ${tries.length}/3 guesses · ${r.liarCaught?'Liar caught':'Liar escaped'}\nCan you crack the case?`;try{if(navigator.share){await navigator.share({title:'WORD CRIME',text:msg});return}if(navigator.clipboard){await navigator.clipboard.writeText(msg);$('#share').textContent='COPIED ✓';return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('textarea');a.value=msg;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();$('#share').textContent='COPIED ✓'}
}
render();
})();
</script></body></html>
